[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgexporter"
version = "0.1.0"
description = "Export Telegram channel posts to local Markdown files and WeChat drafts."
readme = "docs/实现方案.md"
requires-python = ">=3.11"
authors = [
  { name = "chengjinxt" }
]

[project.optional-dependencies]
wechat = ["playwright>=1.45"]
local-translation = ["ctranslate2==4.8.2", "sentencepiece==0.2.2"]
dev = ["pytest>=7"]

[project.scripts]
tgexporter = "tgexporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
